name: Fix Special Lunch 15 description
on:
  push:
    branches:
      - master
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Special Lunch 15
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'ONE STUFFED QUESADILLA (YOUR CHOICE OF FLANK STEAK, CHICKEN OR GROUND BEEF) WITH RICE & BEANS'
          new = 'ONE STUFFED QUESADILLA (YOUR CHOICE OF FLANK STEAK, CHICKEN, PORK OR GROUND BEEF) WITH RICE & BEANS'
          if old not in s:
              raise SystemExit('Expected Special Lunch #15 description was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Special Lunch 15 description'
          git push
