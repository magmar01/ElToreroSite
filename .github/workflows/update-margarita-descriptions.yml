name: Update margarita descriptions
on:
  push:
    branches:
      - master
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'LIME, STRAWBERRY OR MANGO'
          new = 'LIME, STRAWBERRY, PEACH OR MANGO'
          if s.count(old) < 2:
              raise SystemExit(f'Expected at least 2 descriptions, found {s.count(old)}')
          s = s.replace(old, new, 2)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update first two mixed drink descriptions'
          git push
