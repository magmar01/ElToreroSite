name: Add taco description
on:
  push:
    branches:
      - master
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update taco description
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          pattern = r'(<li>\s*<span class="name">ORDER OF TACOS \(3\)</span>.*?<small class="desc">)BEEF, BEAN, PORK, OR CHICKEN(</small>)'
          new, count = re.subn(pattern, r'\1YOUR CHOICE OF BEEF, CHICKEN OR PORK IN A HARD OR SOFT SHELL\2', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one taco entry match, found {count}')
          p.write_text(new)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add description to order of tacos'
          git push
