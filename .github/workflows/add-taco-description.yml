name: Add taco description
on:
  push:
    branches:
      - master
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update taco description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''<span class="name">ORDER OF TACOS (3)</span>\n\t\t\t\t\t\t\t<span class="price">9.00/span>\n\t\t\t\t\t\t\t<small class="desc">BEEF, BEAN, PORK, OR CHICKEN</small>'''
          new = '''<span class="name">ORDER OF TACOS (3)</span>\n\t\t\t\t\t\t\t<span class="price">9.00/span>\n\t\t\t\t\t\t\t<small class="desc">YOUR CHOICE OF BEEF, CHICKEN OR PORK IN A HARD OR SOFT SHELL</small>'''
          if old not in s:
              raise SystemExit('Target taco entry not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git commit -m 'Add description to order of tacos'
          git push
