name: Remove one flauta

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only A La Carte ONE FLAUTA item
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">ONE FLAUTA</span>\n\t\t\t\t\t\t\t<span class="price">4.75</span>\n\t\t\t\t\t\t\t<small class="desc"></small>\n\t\t\t\t\t\t</li>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 A La Carte ONE FLAUTA block, found {s.count(old)}')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/remove-one-flauta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-one-flauta.yml
          git commit -m "Remove A La Carte one flauta"
          git push
