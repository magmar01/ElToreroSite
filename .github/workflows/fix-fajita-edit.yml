name: Fix Fajita Edit

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore unrelated descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          replacements = {
              "LETTUCE, TOMATO, STEAK, SHREDDED CHEESE, GUACAMOLE, & SOUR CREAM SERVED IN A CRISPY FLOUR TORTILLA BOWL": "LETTUCE, TOMATO, BEEF, SHREDDED CHEESE, GUACAMOLE, & SOUR CREAM SERVED IN A CRISPY FLOUR TORTILLA BOWL",
              "LETTUCE, TOMATO, STEAK, & MELTED NACHO CHEESE SAUCE SERVED IN A CRISPY FLOUR TORTILLA BOWL": "LETTUCE, TOMATO, BEEF, & MELTED NACHO CHEESE SAUCE SERVED IN A CRISPY FLOUR TORTILLA BOWL",
              "YOUR CHOICE OF STEAK STEAK, CHICKEN, SHRIMP OR PORK TENDERLOIN": "YOUR CHOICE OF BEEF STEAK, CHICKEN, SHRIMP OR PORK TENDERLOIN",
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix unrelated menu descriptions" || exit 0
          git push
