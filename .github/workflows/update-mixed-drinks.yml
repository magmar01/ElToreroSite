name: Update mixed drinks and soft drinks

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update menu entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="name">FROZEN MARGARITA (16oz.)</span>'
          new = old + '\n\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA 22oz.)</span>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 Frozen Margarita 16oz entry, found {s.count(old)}')
          s = s.replace(old, new, 1)
          lines = s.splitlines(True)
          out = []
          removed = 0
          for line in lines:
              if '<span class="name">MILKSHAKE</span>' in line or '<span class="name">MILKSHAKES</span>' in line:
                  removed += 1
                  continue
              out.append(line)
          if removed != 1:
              raise SystemExit(f'Expected exactly 1 milkshake entry, removed {removed}')
          p.write_text(''.join(out), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add 22oz frozen margarita and remove milkshake'
          git push
