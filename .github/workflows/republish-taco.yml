name: Republish taco description
on:
  push:
    paths:
      - '.github/workflows/republish-taco.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  republish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh taco description
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='YOUR CHOICE OF BEEF, CHICKEN OR PORK IN A HARD OR SOFT SHELL</small>\n'
          new='YOUR CHOICE OF BEEF, CHICKEN OR PORK IN A HARD OR SOFT SHELL</small> \n'
          if old not in s:
              raise SystemExit('Target description not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh taco description' || exit 0
          git push