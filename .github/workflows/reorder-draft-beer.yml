name: Reorder draft beer by size
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder Draft Beer entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          start = s.find('<h2 Class="menu-h2 tostadas">Draft Beer</h2>')
          if start < 0:
              start = s.find('<h2 class="menu-h2 tostadas">Draft Beer</h2>')
          end = s.find('<h2 Class="menu-h2 tostadas">Mixed Drinks</h2>', start)
          if end < 0:
              end = s.find('<h2 class="menu-h2 tostadas">Mixed Drinks</h2>', start)
          if start < 0 or end < 0:
              raise SystemExit('Draft Beer section boundaries not found')
          section = s[start:end]
          list_start = section.find('<ul class="leaders">')
          list_end = section.find('</ul>', list_start)
          if list_start < 0 or list_end < 0:
              raise SystemExit('Draft Beer list not found')
          list_block = section[list_start:list_end+5]
          items = re.findall(r'\s*<li>.*?</li>', list_block, re.S)
          def oz(item):
              m = re.search(r'\((\d+)oz[.,]?\)', item, re.I)
              return int(m.group(1)) if m else 9999
          if len(items) != 5:
              raise SystemExit(f'Expected 5 draft beer entries, found {len(items)}')
          ordered = sorted(items, key=oz)
          new_list = '<ul class="leaders">' + '\n'.join(ordered) + '\n\t\t\t\t\t</ul>'
          new_section = section[:list_start] + new_list + section[list_end+5:]
          p.write_text(s[:start] + new_section + s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Order draft beer from smallest to largest'
          git push