name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Surgical hours centering edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          old = '''  .hours-wrap {\n    position: relative !important;\n    width: 100% !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n  }\n\n  .hours {\n    display: flex !important;\n    width: fit-content !important;\n    max-width: calc(100% - 40px) !important;\n    margin-left: auto !important;\n    margin-right: auto !important;\n  }'''
          new = '''  .hours-wrap {\n    position: relative !important;\n    display: flex !important;\n    justify-content: center !important;\n    align-items: flex-start !important;\n    width: 100% !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n  }\n\n  .hours {\n    display: flex !important;\n    width: max-content !important;\n    max-width: calc(100% - 40px) !important;\n    margin: 0 !important;\n  }'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one hours source block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- style.css

      - name: Commit surgical hours centering edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git diff --cached --check
          git diff --cached -- style.css
          git commit -m "Center desktop hours box group"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4