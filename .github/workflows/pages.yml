name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Surgical mobile hours source edit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          old = '''  .hours-wrap,.hours { position:relative !important; width:100% !important; max-width:100% !important; min-width:0 !important; }'''
          new = '''  .hours-wrap { position:relative !important; display:flex !important; justify-content:center !important; align-items:flex-start !important; width:100% !important; max-width:100% !important; min-width:0 !important; }
  .hours { position:relative !important; display:flex !important; width:max-content !important; max-width:calc(100% - 30px) !important; min-width:0 !important; margin:0 auto !important; }
  .hours .day,
  .hours .hours-open { flex:0 0 auto !important; }'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one mobile hours block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
