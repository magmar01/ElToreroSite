name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Repair the malformed HTML that prevents Prettier from parsing
      # index.html. These edits only repair invalid tags/nesting.
      - name: Fix malformed menu HTML
        run: |
          sed -i 's#POLLO LOCO MIXED/span>#POLLO LOCO MIXED</span>#' index.html
          sed -i '/^[[:space:]]*<\/div>[[:space:]]*$/ { N; N; N; /<\/div>[[:space:]]*\n[[:space:]]*<\/div>[[:space:]]*\n[[:space:]]*<\/div>[[:space:]]*\n[[:space:]]*<\/div>[[:space:]]*\n[[:space:]]*<div class="hours-section"/ { s#\n[[:space:]]*<\/div>[[:space:]]*$##; } }' index.html

      # Keep the source HTML clean and consistently formatted. This only
      # changes whitespace/formatting; it does not change menu structure.
      - name: Format index.html
        run: npx --yes prettier@3.6.2 --write index.html

      - name: Commit formatted index.html
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format index.html for easier menu editing"
          git push

      - name: Fix restaurant ZIP in deployed script
        run: sed -i 's/Duluth, GA 30043/Duluth, GA 30096/g' script.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
