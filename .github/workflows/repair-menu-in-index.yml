name: One-time menu index repair

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move menu content into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text()

          # Restore appetizer items directly in the source HTML so all menu
          # content is easy to find and edit in index.html.
          app_heading = html.find('<h2 class="menu-h2">Appetizers</h2>')
          if app_heading == -1:
              raise SystemExit('Appetizers heading not found')
          list_start = html.find('<ul class="leaders">', app_heading)
          if list_start == -1:
              raise SystemExit('Appetizers list not found')
          first_item = html.find('\n', list_start) + 1
          if 'class="name">CHEESE DIP</span>' not in html[app_heading:html.find('</ul>', list_start)]:
              items = '''\n\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">CHEESE DIP</span>\n\t\t\t\t\t\t\t<span class="price">8.50</span>\n\t\t\t\t\t\t</li>\n\n\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">GUACAMOLE DIP</span>\n\t\t\t\t\t\t\t<span class="price">8.50</span>\n\t\t\t\t\t\t\t<small class="desc">CREAMY OR CHUNKY</small>\n\t\t\t\t\t\t</li>\n'''
              html = html[:first_item] + items + html[first_item:]

          # Restore the missing Lunch descriptions directly in index.html.
          descriptions = {
              'SPEEDY GONZALEZ': 'TACO, ENCHILADA, AND YOUR CHOICE OF RICE OR BEANS',
              'SPECIAL LUNCH #1': 'CHILE RELLENO, TACO, BEANS & GUACAMOLE SALAD',
              'SPECIAL LUNCH #2': 'BURRITO, RICE & BEANS',
              'SPECIAL LUNCH #3': 'CHALUPA, RICE & BEANS',
              'SPECIAL LUNCH #4': 'TACO, RICE & BEANS',
              'SPECIAL LUNCH #5': 'BURRITO, TACO & BEANS',
          }

          lunch_heading = html.find('<h2 class="menu-h2">Lunch</h2>')
          if lunch_heading == -1:
              raise SystemExit('Lunch heading not found')
          lunch_end = html.find('</ul>', html.find('<ul class="leaders">', lunch_heading))
          if lunch_end == -1:
              raise SystemExit('Lunch list not found')
          lunch = html[lunch_heading:lunch_end]

          for name, desc in descriptions.items():
              pattern = rf'(<span class="name">{re.escape(name)}</span>\s*<span class="price">[^<]+</span>)(\s*)'
              replacement = rf'\1\n\t\t\t\t\t\t\t<small class="desc">{desc}</small> \n'
              lunch, count = re.subn(pattern, replacement, lunch, count=1)
              if count != 1:
                  raise SystemExit(f'Missing or already altered lunch item: {name}')

          html = html[:lunch_heading] + lunch + html[lunch_end:]
          path.write_text(html)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No menu changes needed."
            exit 0
          fi
          git commit -m "Move menu content into index.html"
          git push
