name: Fix Aguas Naturales Description
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match menu description style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'Horchata, Jamaica & Tamarindo'
          new = 'HORCHATA, JAMAICA & TAMARINDO'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one description to update, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match Aguas Naturales description style"
          git push
