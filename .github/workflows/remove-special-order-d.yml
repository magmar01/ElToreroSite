name: Remove Special Order D Items

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Special Order D entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">SPECIAL ORDER D</span>\n\t\t\t\t\t\t\t<span class="price">13.00</span>\n\t\t\t\t\t\t\t<small class="desc">ORDER OF TWO BURRITOS TOPPED WITH MEXICAN CHILE SAUCE</small>\n\t\t\t\t\t\t</li>\n\n\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">SINGLE SPECIAL D</span>\n\t\t\t\t\t\t\t<span class="price">7.75</span>\n\t\t\t\t\t\t\t<small class="desc"></small>\n\t\t\t\t\t\t</li>\n'''
          if old not in s:
              raise SystemExit('Target entries not found; no changes made.')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Special Order D items"
          git push
