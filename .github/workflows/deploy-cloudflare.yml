name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy site from repository root
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config ./wrangler.jsonc

      - name: Purge Cloudflare cache for the production hostname
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"hosts":["eltoreroduluth.com"]}'
          )"

          echo "$response" | grep -q '"success":true'

# Deployment path: repository root -> wrangler.jsonc -> Cloudflare Workers static assets.
