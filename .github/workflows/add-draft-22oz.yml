name: Add draft beer 22oz option
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GLASS 22oz entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          if 'GLASS (22oz.)' in s:
              print('Already present')
              raise SystemExit(0)
          pattern = r'(<li>\s*<span class="name">GLASS \(12oz\.\)</span>.*?</li>)'
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('GLASS (12oz.) draft beer item not found')
          original = m.group(1)
          new = re.sub(r'(<span class="name">)GLASS \(12oz\.\)(</span>)', r'\1GLASS (22oz.)\2', original, count=1)
          s = s[:m.end()] + '\n\n' + new + s[m.end():]
          p.write_text(s)
          print('Added GLASS (22oz.)')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add GLASS (22oz.) draft beer option'
          git push