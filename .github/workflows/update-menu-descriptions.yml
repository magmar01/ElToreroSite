name: Update menu descriptions

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-descriptions:
    if: "github.event.head_commit.message == 'Add temporary workflow to update Special Lunch descriptions'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          targets = {
              'SPECIAL LUNCH #11': 'Two tacos (hard or soft shell) with your choice of rice or beans.',
              'SPECIAL LUNCH #12': 'Two Enchiladas with your choice of rice or beans.',
          }
          for item, new_desc in targets.items():
              pattern = rf'(<span class="name">{re.escape(item)}</span>.*?<small class="desc">)(.*?)(</small>)'
              s, count = re.subn(pattern, rf'\g<1>{new_desc}\g<3>', s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not uniquely update {item}; matches={count}')
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Special Lunch descriptions"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-menu-descriptions.yml
          git commit -m "Remove temporary menu update workflow"
          git push
