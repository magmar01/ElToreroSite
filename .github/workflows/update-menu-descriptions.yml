name: Update menu descriptions

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-descriptions:
    if: "!contains(github.event.head_commit.message, 'Update Special Lunch descriptions')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              'ONE FLAUTA, LETTUCE, SOUR CREAM, GUACAMOLE, & PICO DE GALLO': 'Two tacos (hard or soft shell) with your choice of rice or beans.',
              'ONE FLAUTA, RICE & BEANS': 'Two Enchiladas with your choice of rice or beans.',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Special Lunch descriptions"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-menu-descriptions.yml
          git commit -m "Remove temporary menu update workflow"
          git push
