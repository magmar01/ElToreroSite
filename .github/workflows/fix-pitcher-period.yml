name: Fix draft beer pitcher punctuation
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  fix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix punctuation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'PITCHER (60oz,)'
          new = 'PITCHER (60oz.)'
          if old not in s:
              raise SystemExit('Target text not found')
          if s.count(old) != 1:
              raise SystemExit(f'Expected 1 target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix draft beer pitcher punctuation'
          git push
