name: Fix menu entry structure

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA (16oz.)</span>\n\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA 22oz.)</span>\n\t\t\t\t\t\t\t<span class="price">8.50</span>'''
          new = '''\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA (16oz.)</span>\n\t\t\t\t\t\t\t<span class="price">8.50</span>'''
          if s.count(old) != 1:
              raise SystemExit('Expected current combined Frozen Margarita entry exactly once')
          s = s.replace(old, new, 1)
          marker = '''\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA (16oz.)</span>\n\t\t\t\t\t\t\t<span class="price">8.50</span>\n\t\t\t\t\t\t\t<small class="desc">LIME, STRAWBERRY OR MANGO</small> \n\t\t\t\t\t\t</li>'''
          replacement = marker + '''\n\n\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="name">FROZEN MARGARITA 22oz.)</span>\n\t\t\t\t\t\t</li>'''
          if s.count(marker) != 1:
              raise SystemExit('Expected Frozen Margarita 16oz block exactly once')
          s = s.replace(marker, replacement, 1)
          orphan = '''\t\t\t\t\t\t<li>\n\t\t\t\t\t\t\t<span class="price">3.85</span>\n\t\t\t\t\t\t\t<small class="desc">VANILLA</small> \n\t\t\t\t\t\t</li>'''
          if s.count(orphan) != 1:
              raise SystemExit('Expected orphaned milkshake price/description block exactly once')
          s = s.replace(orphan, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix frozen margarita and milkshake entry structure'
          git push
